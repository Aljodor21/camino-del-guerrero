services:

  # ── Base de datos PostgreSQL ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend Django + Gunicorn ─────────────────────────────────────────────
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env.docker
    volumes:
      - static_files:/app/staticfiles
    command: >
      sh -c "python manage.py migrate --no-input &&
             python manage.py loaddata fixtures/initial_data.json &&
             python manage.py crear_admin &&
             python manage.py collectstatic --no-input &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120"

  # ── Frontend Angular + Nginx ──────────────────────────────────────────────
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - static_files:/staticfiles:ro

volumes:
  postgres_data:   # datos de la BD — persisten entre reinicios
  static_files:    # archivos estáticos de Django (admin, etc.)
