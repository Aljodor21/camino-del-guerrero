<div class="min-h-screen flex items-center justify-center px-4 bg-gray-50 dark:bg-dark-900">
  <div class="w-full max-w-sm">

    <!-- Volver al home -->
    <div class="flex justify-start mb-4">
      <a [routerLink]="['/']"
         class="inline-flex items-center gap-1.5 text-sm text-gray-400 hover:text-guerrero-red transition-colors">
        <i class="pi pi-arrow-left text-xs"></i>
        Volver al inicio
      </a>
    </div>

    <!-- Logo -->
    <div class="flex justify-center mb-8">
      <a [routerLink]="['/']">
        <img
          [src]="theme.isDark() ? '/Logo oscuro-sf.png' : '/Logo claro-sf.png'"
          alt="Camino del Guerrero"
          class="h-32 w-auto"
        />
      </a>
    </div>

    <!-- Card -->
    <div class="bg-white dark:bg-dark-800 rounded-2xl shadow-lg p-8 space-y-5">
      <h1 class="text-xl font-bold text-center text-gray-900 dark:text-white">
        Iniciar sesión
      </h1>

      @if (error()) {
        <p-message severity="error" [text]="error()" styleClass="w-full" />
      }

      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">

        <div class="flex flex-col gap-1">
          <label class="text-sm font-medium text-gray-600 dark:text-gray-400">Correo</label>
          <input
            pInputText
            type="email"
            formControlName="email"
            placeholder="tu@correo.com"
            class="w-full"
            autocomplete="email"
          />
        </div>

        <div class="flex flex-col gap-1">
          <label class="text-sm font-medium text-gray-600 dark:text-gray-400">Contraseña</label>
          <p-password
            formControlName="password"
            placeholder="••••••••"
            [feedback]="false"
            [toggleMask]="true"
            styleClass="w-full"
            inputStyleClass="w-full"
            autocomplete="current-password"
          />
        </div>

        <p-button
          type="submit"
          label="Entrar"
          [loading]="loading()"
          [disabled]="form.invalid"
          styleClass="w-full mt-2"
        />

      </form>

      <p class="text-center text-sm text-gray-500 dark:text-gray-400">
        ¿No tienes cuenta?
        <a [routerLink]="'/auth/registro'" class="text-guerrero-red font-medium hover:underline">
          Regístrate
        </a>
      </p>
    </div>

  </div>
</div>
