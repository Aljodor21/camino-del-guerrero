<div class="min-h-screen flex items-center justify-center px-4 py-8 bg-gray-50 dark:bg-dark-900">
  <div class="w-full max-w-sm">

    <div class="flex justify-center mb-8">
      <img
        [src]="theme.isDark() ? '/Logo oscuro-sf.png' : '/Logo claro-sf.png'"
        alt="Camino del Guerrero"
        class="h-24 w-auto"
      />
    </div>

    <div class="bg-white dark:bg-dark-800 rounded-2xl shadow-lg p-8 space-y-5">
      <h1 class="text-xl font-bold text-center text-gray-900 dark:text-white">Crear cuenta</h1>

      @if (error()) {
        <p-message severity="error" [text]="error()" styleClass="w-full" />
      }

      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">

        <div class="flex flex-col gap-1">
          <label class="text-sm font-medium text-gray-600 dark:text-gray-400">Nombre</label>
          <input pInputText formControlName="nombre" placeholder="Tu nombre" class="w-full" />
        </div>

        <div class="flex flex-col gap-1">
          <label class="text-sm font-medium text-gray-600 dark:text-gray-400">Usuario</label>
          <input pInputText formControlName="username" placeholder="nombre_usuario" class="w-full" autocomplete="username" />
        </div>

        <div class="flex flex-col gap-1">
          <label class="text-sm font-medium text-gray-600 dark:text-gray-400">Correo</label>
          <input pInputText type="email" formControlName="email" placeholder="tu@correo.com" class="w-full" autocomplete="email" />
        </div>

        <div class="flex flex-col gap-1">
          <label class="text-sm font-medium text-gray-600 dark:text-gray-400">Contraseña</label>
          <p-password formControlName="password" placeholder="Mínimo 8 caracteres"
                      [toggleMask]="true" styleClass="w-full" inputStyleClass="w-full"
                      autocomplete="new-password" />
        </div>

        <div class="flex flex-col gap-1">
          <label class="text-sm font-medium text-gray-600 dark:text-gray-400">Fecha de nacimiento</label>
          <input type="date" formControlName="fecha_nacimiento"
                 class="w-full rounded-lg border border-gray-300 dark:border-dark-700 bg-white dark:bg-dark-700
                        text-gray-900 dark:text-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-guerrero-red" />
        </div>

        <div class="flex flex-col gap-2">
          <label class="text-sm font-medium text-gray-600 dark:text-gray-400">Sexo biológico</label>
          <div class="grid grid-cols-2 gap-2">
            @for (s of sexos(); track s.id) {
              <button
                type="button"
                (click)="form.controls.sexo.setValue(s.id)"
                [class]="form.controls.sexo.value === s.id
                  ? 'flex items-center justify-center gap-2 p-3 rounded-xl border-2 border-guerrero-red bg-red-50 dark:bg-guerrero-red/10 text-guerrero-red font-semibold text-sm transition-all'
                  : 'flex items-center justify-center gap-2 p-3 rounded-xl border-2 border-gray-200 dark:border-dark-700 text-gray-600 dark:text-gray-400 text-sm transition-all'"
              >
                <i [class]="s.nombre === 'Masculino' ? 'pi pi-mars' : 'pi pi-venus'"></i>
                {{ s.nombre }}
              </button>
            }
          </div>
        </div>

        <p-button type="submit" label="Registrarme" [loading]="loading()"
                  [disabled]="form.invalid" styleClass="w-full mt-2" />

      </form>

      <p class="text-center text-sm text-gray-500 dark:text-gray-400">
        ¿Ya tienes cuenta?
        <a [routerLink]="'/auth/login'" class="text-guerrero-red font-medium hover:underline">
          Inicia sesión
        </a>
      </p>
    </div>

  </div>
</div>
