<div class="p-4 max-w-2xl mx-auto space-y-6 pb-8">
  <app-portada foto="agenda" titulo="Mi perfil" subtitulo="Tus datos personales y tu proceso." />

  <!-- ── DATOS PERSONALES ── -->
  <div class="bg-white dark:bg-dark-800 rounded-2xl shadow-sm p-5 space-y-5">
    <h2 class="font-semibold text-gray-900 dark:text-white flex items-center gap-2">
      <i class="pi pi-user text-guerrero-red"></i> Datos personales
    </h2>

    <p class="flex gap-2 text-xs text-gray-500 dark:text-gray-400 leading-relaxed">
      <i class="pi pi-lock text-xs mt-0.5 shrink-0" aria-hidden="true"></i>
      Tus datos de inicio quedan guardados tal cual y no se editan. Si hay un error, pídele al
      administrador que lo corrija. Aquí solo cambias tus restricciones alimentarias.
    </p>

    @if (errorPerfil()) {
      <p-message severity="error" [text]="errorPerfil()" styleClass="w-full" />
    }
    @if (okPerfil()) {
      <p-message severity="success" text="Datos guardados correctamente." styleClass="w-full" />
    }

    <form [formGroup]="formPerfil" (ngSubmit)="guardarPerfil()" class="space-y-4">
      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-gray-600 dark:text-gray-400">Nombre completo</label>
        <input pInputText formControlName="nombre" placeholder="Tu nombre" class="w-full" />
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div class="flex flex-col gap-1">
          <label class="text-sm font-medium text-gray-600 dark:text-gray-400">Sexo</label>
          <p-select
            formControlName="sexo_id"
            [options]="sexos()"
            optionLabel="nombre"
            optionValue="id"
            placeholder="Selecciona"
            styleClass="w-full"
          />
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-sm font-medium text-gray-600 dark:text-gray-400"
            >Fecha de nacimiento</label
          >
          <input pInputText type="date" formControlName="fecha_nacimiento" class="w-full" />
        </div>
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-gray-600 dark:text-gray-400">Estatura (cm)</label>
        <p-inputnumber
          formControlName="estatura"
          [min]="100"
          [max]="250"
          placeholder="175"
          styleClass="w-full"
        />
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div class="flex flex-col gap-1">
          <label class="text-sm font-medium text-gray-600 dark:text-gray-400">Nacionalidad</label>
          <p-autocomplete
            formControlName="nacionalidad"
            [suggestions]="paisesFiltrados()"
            (completeMethod)="filtrarPaises($event.query)"
            placeholder="Busca tu país..."
            [forceSelection]="true"
            styleClass="w-full"
            inputStyleClass="w-full"
          />
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-sm font-medium text-gray-600 dark:text-gray-400"
            >Región o ciudad</label
          >
          <input
            pInputText
            formControlName="region"
            placeholder="Ej: Paisa, Costa, Bogotá..."
            class="w-full"
          />
        </div>
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-gray-600 dark:text-gray-400">
          Restricciones alimentarias
          <span class="font-normal text-gray-400">(opcional)</span>
        </label>
        <input
          pInputText
          formControlName="preferencias_alimentarias"
          placeholder="Ej: sin gluten, vegetariano..."
          class="w-full"
        />
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-sm font-medium text-gray-600 dark:text-gray-400">
          ¿Cada cuánto registras tu peso?
        </label>
        <p-selectbutton
          formControlName="frecuencia_peso"
          [options]="frecuenciaOpciones"
          optionLabel="label"
          optionValue="value"
          styleClass="w-full"
        />
      </div>

      <p-button
        type="submit"
        label="Guardar datos personales"
        icon="pi pi-check"
        [loading]="savingPerfil()"
        [disabled]="formPerfil.invalid"
        styleClass="w-full"
      />
    </form>
  </div>

  <app-mi-proceso />
</div>
