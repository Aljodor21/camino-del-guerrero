<div class="min-h-screen bg-warm-bg dark:bg-dark-900 text-gray-900 dark:text-white">
  <!-- Navbar superior -->
  <header
    class="fixed top-0 inset-x-0 z-50 h-14 flex items-center justify-between px-4 bg-warm-card dark:bg-dark-800 border-b border-gray-300 dark:border-dark-700 shadow-sm"
  >
    <a [routerLink]="['/']">
      <img
        [src]="themeService.isDark() ? '/Logo oscuro-sf.png' : '/Logo claro-sf.png'"
        alt="Camino del Guerrero"
        class="h-12 w-auto"
      />
    </a>
    <div class="flex items-center gap-1">
      <span class="text-sm font-medium text-gray-500 dark:text-gray-400 hidden sm:block mr-1">
        {{ authService.usuario()?.nombre }}
      </span>
      <p-button
        [icon]="themeService.isDark() ? 'pi pi-sun' : 'pi pi-moon'"
        variant="text"
        [rounded]="true"
        (onClick)="themeService.toggle()"
      />
      <p-button
        icon="pi pi-sign-out"
        variant="text"
        [rounded]="true"
        severity="danger"
        (onClick)="authService.logout()"
        pTooltip="Cerrar sesión"
        tooltipPosition="bottom"
      />
    </div>
  </header>

  <!-- Contenido principal -->
  <main class="pt-14 pb-16 min-h-screen">
    <!-- Aviso: uno a la vez, el más importante -->
    @if (aviso(); as a) {
      <div
        role="status"
        class="sticky top-14 z-40 bg-amber-50 dark:bg-amber-950 border-b border-amber-300 dark:border-amber-700 px-4 py-2.5 flex items-center gap-3"
      >
        <i [class]="a.icono + ' text-amber-500 text-base shrink-0'" aria-hidden="true"></i>
        <p class="flex-1 text-sm text-amber-800 dark:text-amber-300 font-medium leading-tight">
          {{ a.texto }}
        </p>
        @if (a.accion) {
          <a
            [routerLink]="a.enlace"
            [queryParams]="a.queryParams"
            (click)="descartarAviso(a)"
            class="text-xs font-bold text-amber-700 dark:text-amber-400 underline shrink-0"
          >
            {{ a.accion }}
          </a>
        }
        @if (a.descartar) {
          <button
            type="button"
            (click)="descartarAviso(a)"
            aria-label="Descartar aviso"
            class="text-amber-500 hover:text-amber-700 transition-colors ml-1 shrink-0"
          >
            <i class="pi pi-times text-sm"></i>
          </button>
        }
      </div>
    }

    <router-outlet />
  </main>

  <!-- Navegación inferior -->
  <nav
    class="fixed bottom-0 inset-x-0 z-50 h-16 flex bg-warm-card dark:bg-dark-800 border-t border-gray-300 dark:border-dark-700"
  >
    @for (item of navItems(); track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="!text-guerrero-red"
        class="flex-1 flex flex-col items-center justify-center gap-0.5 text-gray-400 dark:text-gray-500 hover:text-guerrero-red transition-colors"
      >
        <i [class]="item.icon + ' text-xl'"></i>
        <span class="text-xs font-medium">{{ item.label }}</span>
      </a>
    }
  </nav>
</div>
