server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    # Angular — todas las rutas van al index.html (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy al backend Django
    location /api/ {
        client_max_body_size 16m;
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        # Si el backend está caído, la API contesta algo que la app entiende (y no una página HTML).
        error_page 502 503 504 = @api_no_disponible;
    }
    location @api_no_disponible {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"detail":"El servidor no está disponible por ahora."}';
    }

    # La app de Android: el backend guarda una copia de la última versión y nginx la entrega
    # (X-Accel-Redirect), así se descarga en el acto desde nuestro dominio, con avance y reanudación.
    # Solo se llega aquí por la respuesta del backend: no se puede pedir directo.
    location /apk-cache/ {
        internal;
        alias /apk/;
    }

    # Archivos estáticos de Django (admin, DRF browsable API)
    location /static/ {
        alias   /staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
