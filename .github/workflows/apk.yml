# Construye la app de Android (APK firmado) y la publica como release de GitHub.
# La app muestra siempre el enlace a la última: releases/latest/download/camino-del-guerrero.apk
#
# Cada versión sube su número (versionCode = número de corrida) y se firma con la MISMA llave,
# así Android la instala encima de la anterior sin borrar nada. La llave vive en los secretos del
# repo (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD), nunca en git.
name: apk

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

concurrency:
  group: apk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apk:
    name: Construir y publicar el APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Revisar los secretos de firma
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Faltan los secretos de firma del APK (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD). Ver DEPLOY.md."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Web de la app (build móvil)
        working-directory: frontend
        run: |
          npm ci
          npm run build:movil

      - name: Compilar y firmar el APK
        working-directory: frontend/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/camino-release.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/camino-release.jks"
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/camino-del-guerrero.apk"
          rm -f "$KEYSTORE_FILE"

      - name: Publicar el release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${APP_VERSION_NAME}" "$RUNNER_TEMP/camino-del-guerrero.apk" \
            --target "${{ github.sha }}" \
            --title "Camino del Guerrero ${APP_VERSION_NAME}" \
            --notes "App de Android, versión ${APP_VERSION_NAME}. Se instala encima de la anterior." \
            --latest

      - name: Conservar solo los últimos 10 releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | tail -n +11 \
            | xargs -r -I{} gh release delete {} --cleanup-tag --yes
