# Revisa cada pull request antes de que llegue a main. No toca el servidor.
name: ci

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pruebas)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cdg
          POSTGRES_PASSWORD: cdg
          POSTGRES_DB: cdg
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cdg -d cdg"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-no-es-un-secreto
      DEBUG: 'False'
      DB_NAME: cdg
      DB_USER: cdg
      DB_PASSWORD: cdg
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Revisión de Django
        run: python manage.py check
      - name: Migraciones al día
        run: python manage.py makemigrations --check --dry-run
      - name: Pruebas
        run: python manage.py test

  frontend:
    name: Frontend (compila)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build de producción
        run: npx ng build
      - name: Build de la app móvil
        run: npx ng build --configuration movil

  compose:
    name: Docker Compose (válido)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose.yml con el ejemplo de entorno
        run: |
          cp .env.docker.example .env.docker
          docker compose --env-file .env.docker config --quiet
